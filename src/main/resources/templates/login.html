
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | eSports Arena</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6ff;
            color: #17172b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 36px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(25, 25, 70, 0.09);
        }

        .brand {
            color: #5546e8;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 22px;
        }

        h1 { font-size: 29px; margin-bottom: 9px; }

        .subtitle {
            color: #77788b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dedfec;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #5546e8;
            box-shadow: 0 0 0 3px rgba(85, 70, 232, 0.1);
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #5546e8;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-button:hover { background: #4234ce; }

        .message {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .error { color: #c62828; }
        .success { color: #16803c; }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #77788b;
            font-size: 14px;
        }

        a {
            color: #5546e8;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #77788b;
            font-size: 13px;
            font-weight: normal;
        }

        @media (max-width: 480px) {
            .login-container { padding: 26px 22px; }
            h1 { font-size: 25px; }
        }
    </style>
</head>

<body>
    <main class="login-container">
        <div class="brand">eSPORTS ARENA</div>

        <h1>Welcome back</h1>
        <p class="subtitle">
            Log in to continue your competitive journey.
        </p>

        <p class="message error"
           th:if="${param.error}">
            Invalid email or password, or your email hasn't been verified.
        </p>

        <p class="message success"
           th:if="${param.logout}">
            You have been logged out successfully.
        </p>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email"
                       type="email"
                       name="email"
                       placeholder="you@example.com"
                       autocomplete="email"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password"
                       type="password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="submit-button">
                Log In
            </button>
        </form>

        <p class="register-link">
            Don't have an account?
            <a th:href="@{/register}">Create one</a>
        </p>

        <a th:href="@{/}" class="back-link">← Back to home</a>
    </main>
</body>
</html>
