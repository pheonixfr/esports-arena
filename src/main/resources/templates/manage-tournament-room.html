
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tournament Room | eSports Arena</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background: #0c1020;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 550px;
            margin: 50px auto;
            padding: 30px;
            background: #171c30;
            border-radius: 14px;
        }

        h2 {
            color: #7775ff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #353b55;
            border-radius: 7px;
            background: #0c1020;
            color: white;
            font-size: 15px;
        }

        button, .back {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            background: #7775ff;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .back {
            background: #353b55;
            margin-left: 8px;
        }

        .success {
            color: #55df91;
            margin-top: 15px;
        }

        .error {
            color: #ff7373;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Manage Room Details</h2>

    <p class="subtitle"
       th:text="${tournament.tournamentName}">
        Tournament Name
    </p>

    <form th:action="@{/tournaments/{id}/room/save(id=${tournament.id})}"
          method="post">

        <label>Room ID</label>
        <input type="text"
               name="roomId"
               placeholder="Enter Room ID"
               th:value="${tournament.roomId}"
               required>

        <label>Room Password</label>
        <input type="text"
               name="roomPassword"
               placeholder="Enter Room Password"
               th:value="${tournament.roomPassword}"
               required>

        <button type="submit">Save Room Details</button>

        <a th:href="@{/tournaments/{id}/results/manage(id=${tournament.id})}"
           class="back">
            Back
        </a>

    </form>

    <p class="success"
       th:if="${success}"
       th:text="${success}"></p>

    <p class="error"
       th:if="${error}"
       th:text="${error}"></p>

</div>

</body>
</html>
