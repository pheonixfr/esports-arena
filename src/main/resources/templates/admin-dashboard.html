<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | eSports Arena</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #0c1020;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #7775ff;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #202943;
        }

        .success {
            color: #6ee7a0;
        }

        .error {
            color: #ff7777;
        }

        .table-wrapper {
            overflow-x: auto;
            background: #171c30;
            border-radius: 12px;
            padding: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #30364d;
        }

        th {
            color: #aaaaff;
        }

        select, button {
            padding: 9px;
            border: none;
            border-radius: 6px;
        }

        select {
            background: #252c45;
            color: white;
        }

        button {
            background: #7775ff;
            color: white;
            cursor: pointer;
            margin-left: 5px;
        }

        button:hover {
            background: #605de0;
        }

        .approve-btn {
            background: #16834a;
        }

        .approve-btn:hover {
            background: #106b3b;
        }

        .approved {
            color: #6ee7a0;
        }

        .pending {
            color: #ffcc66;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #aaaaff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Admin Dashboard</h1>
    <p class="subtitle">Manage registered users and their permissions.</p>

    <div th:if="${success}" class="message success"
         th:text="${success}"></div>

    <div th:if="${error}" class="message error"
         th:text="${error}"></div>

    <div class="table-wrapper">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Email Verified</th>
                    <th>Manage Role</th>
                    <th>Organiser Approval</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.role}"></td>
                    <td th:text="${user.emailVerified ? 'Yes' : 'No'}"></td>

                    <td>
                        <form th:action="@{/admin/users/{id}/role(id=${user.id})}"
                              method="post">

                            <select name="role">
                                <option value="PLAYER"
                                        th:selected="${user.role == 'PLAYER'}">
                                    Player
                                </option>

                                <option value="ORGANISER"
                                        th:selected="${user.role == 'ORGANISER'}">
                                    Organiser
                                </option>

                                <option value="ADMIN"
                                        th:selected="${user.role == 'ADMIN'}">
                                    Admin
                                </option>
                            </select>

                            <button type="submit">Update</button>
                        </form>
                    </td>

                    <td>
                        <div th:if="${user.role == 'ORGANISER'}">

                            <span th:if="${user.organiserApproved}"
                                  class="approved">
                                Approved
                            </span>

                            <form th:unless="${user.organiserApproved}"
                                th:action="@{/admin/users/{id}/organiser-approval(id=${user.id})}"
                                method="post">

                                <input type="hidden" name="approved" value="true">

                                <button type="submit" class="approve-btn">
                                    Approve
                                </button>
                            </form>

                        </div>

                        <span th:unless="${user.role == 'ORGANISER'}">
                            —
                        </span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="7">No registered users found.</td>
                </tr>
            </tbody>
        </table>

    </div>

    <a class="back-link" th:href="@{/}">← Back to Homepage</a>

</div>

</body>
</html>
